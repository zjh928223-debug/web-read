name: Windows quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

concurrency:
  group: windows-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 24 / Python 3.10 / Windows
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.10.10
          cache: pip
          cache-dependency-path: tools/subtitle-workflow/requirements-service.lock

      - name: Install locked frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Install locked backend dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r tools/subtitle-workflow/requirements-service.lock

      - name: Install the pinned Chromium runtime
        shell: pwsh
        run: npx playwright install chromium

      - name: Run fast, security, license, and SBOM gates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/ci | Out-Null
          npm run verify:fast 2>&1 | Tee-Object -FilePath output/ci/verify-fast.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run build, backend, and critical browser journeys
        shell: pwsh
        run: |
          npm run verify:full 2>&1 | Tee-Object -FilePath output/ci/verify-full.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-quality-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            output/ci/**
            output/release/**
            output/production-host/**
            .playwright-artifacts/**
